<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Review Questions</title>
<style>
* { box-sizing: border-box; }
html, body {
    width: 100%; min-width: 0; margin: 0; padding: 0;
    background: transparent; overflow-x: hidden;
}
body {
    color: #263746;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 18px;
    line-height: 1.5;
}
.review-box {
    width: 100%; max-width: 100%; margin: 0;
    border: 1px solid #d6e1ea;
    border-radius: 8px;
    background: #ffffff;
    overflow: hidden;
}
.review-header {
    padding: 18px 20px;
    background: #0064a4;
    color: #ffffff;
}
.review-header h1 { margin: 0 0 5px; font-size: 25px; }
.review-header p { margin: 0; font-size: 17px; }
.progress {
    padding: 11px 20px;
    background: #eaf3f8;
    color: #34566d;
    font-size: 16px;
    font-weight: bold;
}
.question-area { padding: 22px; }
.question-number {
    margin-bottom: 7px; color: #0064a4;
    font-size: 16px; font-weight: bold;
}
.question {
    margin: 0 0 18px; color: #1e2f3b;
    font-size: 22px; font-weight: bold; line-height: 1.4;
}
.option {
    display: block; margin: 11px 0; padding: 13px 15px;
    border: 1px solid #cbd9e3; border-radius: 7px;
    background: #ffffff; cursor: pointer;
}
.option:hover { border-color: #0064a4; background: #f0f7fb; }
.option input { margin-right: 10px; transform: scale(1.2); }
.feedback {
    display: none; margin-top: 16px; padding: 13px 15px;
    border-radius: 7px; font-size: 17px;
}
.feedback.correct {
    display: block; background: #e7f5e9;
    border: 1px solid #72b77b; color: #205b28;
}
.feedback.incorrect {
    display: block; background: #fff0ef;
    border: 1px solid #d9827a; color: #7b2922;
}
.button-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
button {
    padding: 11px 19px; border: 0; border-radius: 6px;
    color: #ffffff; background: #0064a4;
    font-size: 17px; cursor: pointer;
}
button:hover { background: #004d7d; }
button:disabled { cursor: not-allowed; opacity: .55; }
.result { display: none; padding: 28px 22px; text-align: center; }
.result h2 { margin-top: 0; color: #0064a4; font-size: 28px; }
.score { margin: 16px 0; color: #1f5d2a; font-size: 34px; font-weight: bold; }
@media (max-width: 600px) {
    body { font-size: 17px; }
    .question-area { padding: 18px; }
    .question { font-size: 20px; }
    .review-header h1 { font-size: 23px; }
}
</style>
</head>
<body>
<div class="review-box">
    <div class="review-header">
        <h1>Random Review Questions</h1>
        <p>Check your understanding before completing this training section.</p>
    </div>
    <div id="progress" class="progress"></div>
    <div id="questionArea" class="question-area">
        <div id="questionNumber" class="question-number"></div>
        <div id="questionText" class="question"></div>
        <div id="options"></div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
        <div class="button-row">
            <button id="checkButton" type="button">Check Answer</button>
            <button id="nextButton" type="button" disabled>Next Question</button>
        </div>
    </div>
    <div id="result" class="result">
        <h2>Review Complete</h2>
        <div id="scoreText" class="score"></div>
        <p id="resultMessage"></p>
        <div class="button-row" style="justify-content:center;">
            <button id="restartButton" type="button">Try Again</button>
        </div>
    </div>
</div>
<script>
const questionBank = [
    { question: "What should you do before using a chemical for the first time?", options: ["Check the label and relevant Safety Data Sheet", "Mix it with another chemical", "Transfer it to an unlabelled container", "Place it beside the sink"], answer: 0, explanation: "Always check the label and Safety Data Sheet before using a chemical." },
    { question: "What is the main purpose of local exhaust ventilation?", options: ["To control contaminants at or near the source", "To increase room temperature", "To replace all personal protective equipment", "To store chemicals safely"], answer: 0, explanation: "Local exhaust ventilation captures contaminants close to their source before they spread." },
    { question: "Which action is appropriate when a chemical container is damaged?", options: ["Report it and follow the spill or damaged-container procedure", "Ignore it if there is no visible leak", "Put it into a normal waste bin", "Remove the label"], answer: 0, explanation: "A damaged container should be reported and managed according to the established procedure." },
    { question: "Why should chemicals be transported in a suitable carrier?", options: ["To reduce the chance of dropping, breaking, or leaking", "To make the chemical react faster", "To avoid reading the label", "To eliminate the need for training"], answer: 0, explanation: "A suitable carrier provides stability and helps prevent spills or container breakage." },
    { question: "What is the safest response to an unfamiliar chemical smell in a laboratory?", options: ["Stop and report the situation according to the emergency procedure", "Continue working normally", "Try to identify it by smelling it more closely", "Open every chemical container"], answer: 0, explanation: "Do not deliberately sniff chemicals. Stop work and report the concern through the appropriate procedure." },
    { question: "Which statement about personal protective equipment is correct?", options: ["It is selected according to the hazard and task", "Any glove is suitable for every chemical", "PPE removes the need for engineering controls", "PPE can be shared without checking its condition"], answer: 0, explanation: "PPE must be appropriate for the specific hazard, chemical, task, and exposure route." },
    { question: "What information should normally appear on a chemical label?", options: ["The chemical identity and relevant hazard information", "Only the user’s name", "Only the purchase price", "The laboratory room number only"], answer: 0, explanation: "Labels provide chemical identity and important hazard and precautionary information." },
    { question: "What is the safest response to a chemical spill?", options: ["Follow the laboratory spill-response procedure", "Wash the spill into the sink immediately", "Hide the spill until the end of the day", "Use bare hands to clean it"], answer: 0, explanation: "Follow the approved spill-response procedure and obtain assistance when required." }
];
let selectedQuestions = [], currentQuestion = 0, score = 0, answered = false;
function shuffle(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}
function startReview() {
    selectedQuestions = shuffle(questionBank).slice(0, 5);
    currentQuestion = 0; score = 0; answered = false;
    document.getElementById('questionArea').style.display = 'block';
    document.getElementById('result').style.display = 'none';
    displayQuestion();
}
function displayQuestion() {
    const item = selectedQuestions[currentQuestion];
    document.getElementById('progress').textContent = 'Question ' + (currentQuestion + 1) + ' of ' + selectedQuestions.length;
    document.getElementById('questionNumber').textContent = 'Review Question ' + (currentQuestion + 1);
    document.getElementById('questionText').textContent = item.question;
    const options = document.getElementById('options');
    options.innerHTML = '';
    item.options.forEach((option, index) => {
        const label = document.createElement('label');
        label.className = 'option';
        label.innerHTML = '<input type="radio" name="answer" value="' + index + '">' + option;
        options.appendChild(label);
    });
    const feedback = document.getElementById('feedback');
    feedback.className = 'feedback'; feedback.textContent = '';
    document.getElementById('checkButton').disabled = false;
    document.getElementById('nextButton').disabled = true;
    answered = false;
}
function checkAnswer() {
    if (answered) return;
    const selected = document.querySelector('input[name="answer"]:checked');
    if (!selected) { alert('Please select an answer first.'); return; }
    const item = selectedQuestions[currentQuestion];
    const feedback = document.getElementById('feedback');
    if (Number(selected.value) === item.answer) {
        score++;
        feedback.className = 'feedback correct';
        feedback.textContent = 'Correct. ' + item.explanation;
    } else {
        feedback.className = 'feedback incorrect';
        feedback.textContent = 'Not quite. ' + item.explanation + ' The correct answer is: ' + item.options[item.answer] + '.';
    }
    document.querySelectorAll('input[name="answer"]').forEach(input => input.disabled = true);
    document.getElementById('checkButton').disabled = true;
    document.getElementById('nextButton').disabled = false;
    answered = true;
}
function nextQuestion() {
    if (!answered) return;
    currentQuestion++;
    if (currentQuestion < selectedQuestions.length) displayQuestion();
    else showResult();
}
function showResult() {
    document.getElementById('questionArea').style.display = 'none';
    document.getElementById('result').style.display = 'block';
    document.getElementById('progress').textContent = 'Review completed';
    document.getElementById('scoreText').textContent = score + ' / ' + selectedQuestions.length;
    document.getElementById('resultMessage').textContent = score === selectedQuestions.length ? 'Excellent. You answered every question correctly.' : score >= 3 ? 'Good work. Review the explanations for the questions you missed.' : 'Please revisit the relevant training content and try the review again.';
}
document.getElementById('checkButton').addEventListener('click', checkAnswer);
document.getElementById('nextButton').addEventListener('click', nextQuestion);
document.getElementById('restartButton').addEventListener('click', startReview);
startReview();
</script>
</body>
</html>
